<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Cyan / Sky Blue Pick Gradient -->
    <linearGradient id="pickCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Purple / Violet Pick Gradient -->
    <linearGradient id="pickPurpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neonPurpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Cyan Guitar Pick (Ring / Loop) -->
  <path d="M 230 185
           C 255 130, 180 90, 135 125
           C 90 160, 85 240, 115 295
           C 145 350, 220 395, 255 355
           C 285 320, 260 250, 230 185 Z"
        stroke="url(#pickCyanGrad)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#neonCyanGlow)"/>

  <!-- Right Violet Guitar Pick (Interlinked Loop) -->
  <path d="M 282 327
           C 257 382, 332 422, 377 387
           C 422 352, 427 272, 397 217
           C 367 162, 292 117, 257 157
           C 227 192, 252 262, 282 327 Z"
        stroke="url(#pickPurpleGrad)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#neonPurpleGlow)"/>

  <!-- Interlocking Bridge (Cut-through depth segment) -->
  <path d="M 230 185
           C 245 155, 205 110, 160 120"
        stroke="url(#pickCyanGrad)"
        stroke-width="32"
        stroke-linecap="round"
        fill="none"/>
</svg>
