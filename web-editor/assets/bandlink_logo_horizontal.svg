<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" fill="none">
  <defs>
    <!-- Cyan / Sky Blue Pick Gradient -->
    <linearGradient id="hzCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Purple / Violet Pick Gradient -->
    <linearGradient id="hzPurpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Link Text Gradient -->
    <linearGradient id="hzTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(40, 20) scale(0.85)">
    <!-- Cyan Pick -->
    <path d="M 125 90
             C 140 55, 95 30, 65 55
             C 35 80, 30 135, 50 175
             C 70 215, 120 245, 145 220
             C 165 195, 145 140, 125 90 Z"
          stroke="url(#hzCyanGrad)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          filter="url(#hzGlow)"/>

    <!-- Violet Pick -->
    <path d="M 160 170
             C 145 205, 190 230, 220 205
             C 250 180, 255 125, 235 85
             C 215 45, 165 15, 140 40
             C 120 65, 140 120, 160 170 Z"
          stroke="url(#hzPurpleGrad)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          filter="url(#hzGlow)"/>

    <!-- Interlocking Overlay -->
    <path d="M 125 90
             C 135 70, 110 40, 80 50"
          stroke="url(#hzCyanGrad)"
          stroke-width="22"
          stroke-linecap="round"
          fill="none"/>
  </g>

  <!-- Typography -->
  <g transform="translate(300, 160)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
          font-weight="900"
          font-size="115"
          letter-spacing="-2">
      <tspan fill="#ffffff">Band</tspan><tspan fill="url(#hzTextGrad)">Link</tspan>
    </text>
    <text x="5" y="42"
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
          font-weight="600"
          font-size="22"
          letter-spacing="5"
          fill="#94a3b8"
          text-transform="uppercase">
      STAGE &amp; REPERTOIRE
    </text>
  </g>
</svg>
